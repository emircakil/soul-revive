# Keeps the pinned GitHub Actions SHAs and the Raylib-cs package current with reviewed pull requests.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: nuget
    directory: /src-cross
    schedule:
      interval: monthly
