name: Windows build and checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Windows executable
        shell: pwsh
        run: ./build.ps1
      - name: Verify app, installer and updater
        shell: pwsh
        run: ./verify.ps1
      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: soul-revive-windows
          path: |
            bin/SoulsRevive.exe
            bin/SoulRevive-Setup.exe
            bin/SHA256SUMS.txt
      - name: Upload verification previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soul-revive-verification
          path: |
            test-output/*.png
            test-output/results.txt
            test-output/failure.txt
