name: Native platform builds
on:
  workflow_call:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and verify Windows app
        shell: pwsh
        run: |
          ./build.ps1
          ./verify.ps1
          $version = ([Diagnostics.FileVersionInfo]::GetVersionInfo("$PWD/bin/SoulsRevive.exe")).FileVersion
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne ('v' + ([version]$version).ToString(3))) { throw 'Release tag and app version differ.' }
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            bin/SoulsRevive.exe
            bin/SoulRevive-Setup.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checks-windows
          path: |
            test-output/*.png
            test-output/*.txt
  portable:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            rid: linux-x64
            package: linux-x64
          - os: macos-15
            rid: osx-arm64
            package: macos-arm64
          - os: macos-15-intel
            rid: osx-x64
            package: macos-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Linux graphics and audio dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth libgl1-mesa-dri libgl1 libx11-6 libxcursor1 libxrandr2 libxi6 libxinerama1 libasound2t64 libpulse0 desktop-file-utils
      - name: Build, sign, test and package on target OS
        shell: pwsh
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: ./build-cross.ps1 -Runtime '${{ matrix.rid }}'
      - name: Test per-user Linux installation with spaces in path
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p 'test-output/install source'
          tar -xzf bin/soul-revive-linux-x64.tar.gz -C 'test-output/install source'
          export XDG_DATA_HOME="$PWD/test-output/user data"
          'test-output/install source/soul-revive-linux-x64/install.sh'
          desktop-file-validate "$XDG_DATA_HOME/applications/soulrevive.desktop"
          "$XDG_DATA_HOME/soul-revive/app/SoulsRevive" --self-test "$PWD/test-output/installed"
          xvfb-run -a "$XDG_DATA_HOME/soul-revive/app/SoulsRevive" --profile "$PWD/test-output/installed-ui" --smoke-test "$PWD/test-output/installed.png"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.package }}
          path: bin/soul-revive-${{ matrix.package }}.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checks-${{ matrix.package }}
          path: |
            test-output/**/*.png
            test-output/**/*.ppm
            test-output/**/results.txt
